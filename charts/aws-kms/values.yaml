image:
  repository: ghcr.io/konsole-is/camunda-operator-plugins/aws-kms
  # An empty tag is the appVersion of the chart, which the release sets.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# region is the AWS region of the primary keys. Empty takes the region of the
# AWS SDK chain, such as the AWS_REGION of the pod. The controller does not
# start without a region.
region: ""

# aliasPrefix starts the alias of each key: alias/<aliasPrefix>/<namespace>/<claim>.
# It must not be aws or start with aws/.
aliasPrefix: camunda

# extraTags go on each key and each replica, next to the camunda.io/ tags of
# the request, for example a cost center.
extraTags: {}

# keyAdministratorArns are the IAM principals that administer each key. When
# it and csiDriverRoleArn are both empty, each key keeps the default key
# policy, and the controller never reads or writes a key policy.
keyAdministratorArns: []

# csiDriverRoleArn is the IAM role of the EBS CSI driver. The key policy lets
# it encrypt and decrypt with each key, and create grants for EBS volumes.
csiDriverRoleArn: ""

# endpointURL, when set, sends every AWS call to this endpoint instead of the
# endpoints of AWS.
endpointURL: ""

serviceAccount:
  # annotations of the ServiceAccount of the controller, for example the
  # IRSA annotation of the role that the controller itself runs as.
  annotations: {}

# registrations are the PluginRegistrations that the controller writes at
# startup and serves. Each item is a name and the fields of a registration
# spec. The chart adds the limit Alias prefix to each. The chart grants the
# controller the verb serve on each name, and on no other registration. The
# chart refuses to render without one. A request of a registration whose
# parameters hold replicaRegions gets a multi-Region key: set the regions in
# parameterValues, for example parameterValues: {replicaRegions: [eu-central-1]}.
registrations:
  - name: aws-kms-key
    sections: [encryption-key]
    label: AWS KMS key
    description: Creates one customer-managed KMS key with automatic rotation for each cluster.
    docsUrl: https://github.com/konsole-is/camunda-operator-plugins/blob/main/docs/plugins/aws-kms.md
    mode: Optional
    deletionPolicies: [Delete, Orphan]
    outputs: &outputs
      - key: keyRef
        format: aws-kms-arn
        description: The ARN of the key.
      - key: format
        description: "The format of keyRef: aws-kms-arn."
    parameters:
      type: object
      properties:
        pendingWindowDays: &pendingWindowDays
          type: integer
          minimum: 7
          maximum: 30
          default: 30
          description: Days between the delete of the claim and the delete of the key.
  - name: aws-kms-key-multi-region
    sections: [encryption-key]
    label: AWS KMS multi-Region key
    description: Creates one multi-Region KMS key with automatic rotation for each cluster, and a replica in each region of replicaRegions.
    docsUrl: https://github.com/konsole-is/camunda-operator-plugins/blob/main/docs/plugins/aws-kms.md
    mode: Optional
    deletionPolicies: [Delete, Orphan]
    outputs: *outputs
    parameters:
      type: object
      required: [replicaRegions]
      properties:
        pendingWindowDays: *pendingWindowDays
        replicaRegions:
          type: array
          minItems: 1
          x-kubernetes-list-type: set
          items:
            type: string
            pattern: '^([a-z]+-){2,3}[0-9]+$'
          description: The regions of the replicas of the key.

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
