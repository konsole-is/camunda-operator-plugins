image:
  repository: ghcr.io/konsole-is/camunda-operator-plugins/skeleton
  # An empty tag is the appVersion of the chart, which the release sets.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# registrations are the PluginRegistrations that the controller writes at
# startup and serves. Each item is a name and the fields of a registration
# spec. The chart grants the controller the verb serve on each name, and on
# no other registration. The chart refuses to render without one.
registrations:
  - name: skeleton
    # The section skeleton does not exist, so the registry controller does
    # not accept the registration and the fleet manager never offers it.
    sections: [skeleton]
    label: Skeleton option
    description: Writes one ConfigMap for each request. A new plugin copies it.
    mode: Optional
    deletionPolicies: [Delete, Orphan]
    outputs:
      - key: configMapName
        description: The ConfigMap that the skeleton writes for the request.

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
