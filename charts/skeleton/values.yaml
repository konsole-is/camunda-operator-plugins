image:
  repository: ghcr.io/konsole-is/camunda-operator-plugins/skeleton
  # An empty tag is the appVersion of the chart, which the release sets.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# registrations are the PluginRegistrations that the controller serves. The
# chart grants the controller the verb serve on each name, and on no other
# registration. The chart refuses to render without one.
registrations:
  - name: skeleton

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi
