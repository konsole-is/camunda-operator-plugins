# A rolling update runs the old and the new Pod together. Only the Pod that
# holds this Lease writes registrations, Grants, and status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "skeleton.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skeleton.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "skeleton.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skeleton.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "skeleton.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "skeleton.fullname" . }}
    namespace: {{ .Release.Namespace }}
