apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skeleton.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skeleton.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "skeleton.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/registrations: {{ toYaml .Values.registrations | sha256sum }}
      labels:
        {{- include "skeleton.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "skeleton.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -registrations=/etc/plugin/registrations.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          volumeMounts:
            - name: registrations
              mountPath: /etc/plugin
              readOnly: true
          ports:
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: registrations
          configMap:
            name: {{ include "skeleton.fullname" . }}-registrations
