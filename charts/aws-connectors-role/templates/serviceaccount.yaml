apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aws-connectors-role.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-connectors-role.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
