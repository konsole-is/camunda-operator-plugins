{{- range $block := include "aws.blocks" . | fromJsonArray }}
{{- $names := include "aws.registrationNames" (dict "root" $ "block" $block) }}
---
# The grant admission policy of the operator chart admits a Grant only from a
# requester with the verb serve on the registration of the Grant. This role
# grants serve on the registrations of one controller of this release, and
# on no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aws.clusterName" $ }}-{{ $block.name }}-serve
  labels:
    {{- include "aws.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginregistrations"]
    verbs: ["serve"]
    resourceNames:
      {{- $names | trim | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aws.clusterName" $ }}-{{ $block.name }}-serve
  labels:
    {{- include "aws.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aws.clusterName" $ }}-{{ $block.name }}-serve
subjects:
  {{- include "aws.subjects" $ | nindent 2 }}
---
{{- if eq $block.key "identity" }}
# aws-identity applies its registrations, keeps their Ready condition, and
# serves their requests. It reads every registration and every Grant,
# because the Grants of other plugins name their registration, and it writes
# the status of those Grants.
{{- else if eq $block.key "connectorsRole" }}
# aws-connectors-role applies its registrations, keeps their Ready
# condition, and serves their requests. It writes no Grant, but pluginkit
# lists the Grants of a request and deletes them with it.
{{- else if eq $block.key "kms" }}
# aws-kms applies its registrations, keeps their Ready condition, and serves
# their requests. It writes no object in the cluster for a request.
{{- else if eq $block.key "ebs" }}
# aws-ebs applies its registrations, keeps their Ready condition, serves
# their requests, and writes the StorageClass of each request.
{{- else }}
# aws-s3 applies its registrations, keeps their Ready condition, and serves
# their requests. It writes one ObjectStorageConfig for each request.
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aws.clusterName" $ }}-{{ $block.name }}-controller
  labels:
    {{- include "aws.labels" $ | nindent 4 }}
rules:
  {{- if has $block.key (list "identity" "connectorsRole") }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginregistrations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginregistrations"]
    verbs: ["create", "patch"]
    resourceNames:
      {{- $names | trim | nindent 6 }}
  {{- else }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginregistrations"]
    verbs: ["get", "create", "patch"]
    resourceNames:
      {{- $names | trim | nindent 6 }}
  {{- end }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginregistrations/status"]
    verbs: ["update"]
    resourceNames:
      {{- $names | trim | nindent 6 }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginrequests"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginrequests/status"]
    verbs: ["update"]
  # An owner reference with blockOwnerDeletion needs update on the
  # finalizers of the owner.
  - apiGroups: ["plugins.camunda.io"]
    resources: ["pluginrequests/finalizers"]
    verbs: ["update"]
  {{- if eq $block.key "connectorsRole" }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["grants"]
    verbs: ["get", "list", "watch", "delete"]
  {{- else }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["grants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if eq $block.key "identity" }}
  - apiGroups: ["plugins.camunda.io"]
    resources: ["grants/status"]
    verbs: ["get", "update", "patch"]
  {{- end }}
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if eq $block.key "ebs" }}
  # aws-ebs writes one StorageClass for each request, reads it from the API
  # server to find a changed parameter, and deletes it with the request.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- if eq $block.key "s3" }}
  # pluginkit watches the ObjectStorageConfigs that aws-s3 writes through the
  # cache of the manager, which lists them in every namespace.
  - apiGroups: ["core.camunda.io"]
    resources: ["objectstorageconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aws.clusterName" $ }}-{{ $block.name }}-controller
  labels:
    {{- include "aws.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aws.clusterName" $ }}-{{ $block.name }}-controller
subjects:
  {{- include "aws.subjects" $ | nindent 2 }}
{{- end }}
