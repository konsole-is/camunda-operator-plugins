# The controller reads its registrations from this file at startup, and
# applies them as PluginRegistrations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aws-identity.fullname" . }}-registrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-identity.labels" . | nindent 4 }}
data:
  registrations.yaml: |
    {{- include "aws-identity.registrations" . | nindent 4 }}
