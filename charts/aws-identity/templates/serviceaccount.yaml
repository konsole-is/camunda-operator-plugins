apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aws-identity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-identity.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
