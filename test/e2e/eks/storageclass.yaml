# The default StorageClass of the EKS cluster of the eks journey. The
# Elasticsearch volume uses it, and EKS marks no StorageClass default. The
# role of the EBS CSI driver creates only gp3 volumes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
