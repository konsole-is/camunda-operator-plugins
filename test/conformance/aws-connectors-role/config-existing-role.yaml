# The run of plugin-conformance against the registration
# aws-connectors-existing-role. With IRSA the plugin calls no IAM API for
# it, so any role of the run serves: the role of the controller. The case
# runs once with Delete and once with Orphan.
registration: aws-connectors-existing-role
namespace: conformance-aws-connectors-existing-role
timeouts:
  outputsReady: 2m
  ready: 5m
  deletion: 3m
cases:
  - name: basic
    parameters:
      roleArn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RUN_ID}-aws-connectors-role
    target:
      kind: CamundaCluster
      name: orders
      serviceAccountName: orders-connectors
