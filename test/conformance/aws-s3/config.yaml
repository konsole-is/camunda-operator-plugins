# The run of plugin-conformance against the registration aws-s3. Each
# bucket name starts with the run ID, which the policy of the controller
# allows. The case with-key encrypts with the key that setup.sh created. The
# principal names a role that need not exist: the plugin only writes it into
# the ObjectStorageConfig. S3 can show the tags of a new bucket late, and the
# plugin waits up to 5 minutes for them, so the waits are longer. Each case
# runs once with Delete and once with Orphan. teardown.sh deletes the
# orphaned buckets.
registration: aws-s3
namespace: conformance-aws-s3
timeouts:
  outputsReady: 6m
  ready: 6m
  deletion: 6m
cases:
  - name: with-key
    inputs:
      key: ${AWS_KMS_KEY_ARN}
      principal: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RUN_ID}-backup
    parameters:
      bucketPrefix: ${RUN_ID}
    target:
      kind: CamundaCluster
      name: orders
      serviceAccountName: orders-camunda
  - name: without-key
    parameters:
      bucketPrefix: ${RUN_ID}
    target:
      kind: CamundaCluster
      name: orders
      serviceAccountName: orders-camunda
