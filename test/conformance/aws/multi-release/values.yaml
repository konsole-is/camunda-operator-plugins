# The chart values of the release aws of the run in the AWS sandbox: every
# controller but aws-kms is on. aws-kms has its values already, so that
# check.sh turns it on in this release when it moves the keys of the release
# aws-keys here. render.sh fills in the variables of the run. Every AWS
# object gets the run in its name and the tag cpo-ci-run, and every role the
# boundary of the sandbox. The sandbox refuses a key policy, so no key
# administrator and no CSI driver role are set.
mode: irsa
region: ${AWS_REGION}
oidcProviderArn: ${AWS_OIDC_PROVIDER_ARN}
extraTags:
  cpo-ci-run: ${RUN_ID}
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/${RUN_ID}-aws
identity:
  enabled: true
  permissionsBoundaryArn: arn:aws:iam::${AWS_ACCOUNT_ID}:policy/cpo-sandbox-boundary
  allowedActions: ["s3:*", "kms:Decrypt", "kms:GenerateDataKey"]
  roleNamePrefix: ${RUN_ID}-hub
connectorsRole:
  enabled: true
  permissionsBoundaryArn: arn:aws:iam::${AWS_ACCOUNT_ID}:policy/cpo-sandbox-boundary
  roleNamePrefix: ${RUN_ID}-conn
kms:
  enabled: false
  aliasPrefix: ${RUN_ID}
ebs:
  enabled: true
s3:
  enabled: true
