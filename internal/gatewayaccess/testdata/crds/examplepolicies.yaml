# ExamplePolicy stands in for the policy kind of a Gateway implementation,
# such as SecurityPolicy of Envoy Gateway, which envtest does not have.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: examplepolicies.policies.example.com
spec:
  group: policies.example.com
  names:
    kind: ExamplePolicy
    listKind: ExamplePolicyList
    plural: examplepolicies
    singular: examplepolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetRefs:
                  type: array
                  items:
                    type: object
                    required: [group, kind, name]
                    properties:
                      group: {type: string}
                      kind: {type: string}
                      name: {type: string}
                allowed:
                  type: array
                  maxItems: 2
                  items: {type: string}
                mode:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
