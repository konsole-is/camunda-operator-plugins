name: Kind tools
description: >-
  Checks out the operator at the api ref of go.mod into
  $RUNNER_TEMP/camunda-operator, sets OPERATOR_DIR, and installs kind,
  kubebuilder, and Helm. Set up Go before it.

runs:
  using: composite
  steps:
    # The operator on kind is built from the commit that the api module of
    # go.mod names, so its CRDs are those that the plugins are built against.
    - name: Check out the operator at the api ref
      shell: bash
      run: |
        echo "OPERATOR_DIR=${RUNNER_TEMP}/camunda-operator" >> "${GITHUB_ENV}"
        OPERATOR_DIR="${RUNNER_TEMP}/camunda-operator" hack/ci-retry.sh make operator-source

    # kind and kubebuilder install the versions of .tool-versions of the
    # operator, as its own kind jobs do.
    - name: Install kind and kubebuilder
      shell: bash
      run: |
        get() { curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$1" "$2"; }
        arch=$(go env GOARCH)
        KIND_VERSION=$(awk '$1 == "kind" { print $2 }' "${OPERATOR_DIR}/.tool-versions")
        kind_release=https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}
        get "kind-linux-${arch}" "${kind_release}/kind-linux-${arch}"
        get kind.sha256sum "${kind_release}/kind-linux-${arch}.sha256sum"
        sha256sum --check --strict kind.sha256sum
        chmod +x "kind-linux-${arch}" && sudo mv "kind-linux-${arch}" /usr/local/bin/kind
        KUBEBUILDER_VERSION=$(awk '$1 == "kubebuilder" { print $2 }' "${OPERATOR_DIR}/.tool-versions")
        kubebuilder_release=https://github.com/kubernetes-sigs/kubebuilder/releases/download/v${KUBEBUILDER_VERSION}
        get "kubebuilder_linux_${arch}" "${kubebuilder_release}/kubebuilder_linux_${arch}"
        get kubebuilder.checksums "${kubebuilder_release}/checksums.txt"
        awk -v f="kubebuilder_linux_${arch}" '$2 == f' kubebuilder.checksums | sha256sum --check --strict
        chmod +x "kubebuilder_linux_${arch}" && sudo mv "kubebuilder_linux_${arch}" /usr/local/bin/kubebuilder
        rm -f kind.sha256sum kubebuilder.checksums
        kind version
        kubebuilder version

    - name: Install Helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v4.3.2
