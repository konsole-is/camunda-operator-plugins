name: AWS sandbox

# Removes what CI runs left in the AWS sandbox account: every resource with
# the tag cpo-ci-run that is older than six hours, and every EKS cluster,
# node, volume, and image of an EKS run that is older than two hours. A
# cancelled run cannot clean up after itself. A pull request of this
# repository that changes the sweep runs the job sweep too. The function
# cpo-sandbox-sweep of terraform/aws-sandbox runs the same sweep in AWS once
# an hour, and this workflow is its fallback. See hack/aws-sandbox/README.md.
on:
  pull_request:
    paths:
      - .github/workflows/aws-sandbox.yml
      - hack/aws-sandbox/**
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# A run that waits for an approval must not hold back the hourly sweep.
concurrency:
  group: aws-sandbox-sweep-${{ github.actor_id == vars.AWS_SANDBOX_ACTOR_ID && 'trusted' || 'review' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sweep:
    name: Sweep the AWS sandbox
    # GitHub gives a pull request from a fork no OIDC token.
    if: >-
      github.repository == 'konsole-is/camunda-operator-plugins' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Runs of the trusted user need no approval. Each other run waits for an
    # approval in aws-sandbox-review. The CI role checks the actor too.
    environment: ${{ github.actor_id == vars.AWS_SANDBOX_ACTOR_ID && 'aws-sandbox' || 'aws-sandbox-review' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_KMS_REPLICA_REGION: ${{ vars.AWS_KMS_REPLICA_REGION }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Get the credentials of the CI role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Remove resources older than six hours
        run: hack/aws-sandbox/sweep.sh --older-than "$(jq -r .older_than_hours.sweep hack/aws-sandbox/sweep-rules.json)"

  # Two hours is above the job limit of .github/workflows/eks-proof.yml, so a
  # run in progress stays.
  sweep-eks:
    name: Sweep the EKS runs of the AWS sandbox
    # The environment aws-sandbox-sweep accepts only main.
    if: >-
      github.repository == 'konsole-is/camunda-operator-plugins' &&
      vars.AWS_EKS_SANDBOX == 'true' &&
      github.actor_id == vars.AWS_SANDBOX_ACTOR_ID &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The role cpo-sandbox-eks-sweep trusts only this environment and the
    # actor AWS_SANDBOX_ACTOR_ID. The environment has no reviewer.
    environment: aws-sandbox-sweep
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EKS_VPC_ID: ${{ vars.AWS_EKS_VPC_ID }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The cpo-sandbox-ci role cannot see EC2 or EKS, so the EKS runs have a
      # sweep with a role that can only list and delete.
      - name: Get the credentials of the sweep role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SWEEP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Remove EKS runs older than two hours
        run: hack/aws-sandbox/eks-sweep.sh --older-than "$(jq -r .older_than_hours.eks_sweep hack/aws-sandbox/sweep-rules.json)"
