name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The Go module proxy sometimes drops a connection. The retry keeps
      # one dropped download from failing the job.
      - name: Download the Go modules
        run: hack/ci-retry.sh go mod download

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
      - name: Check the workflows
        run: make lint-workflows

      # Renovate's validator is an npm package. The runner's default Node is
      # older than the one Renovate supports.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check Renovate configuration
        run: make lint-renovate
