name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Every other job needs this one, so a tag that is not a release tag stops
  # the run before anything is built or pushed.
  plan:
    name: Check the tag and list the plugins
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      # The release tag is v0.1.0. The images and the charts carry the
      # version without the v, because a Helm chart version is bare SemVer.
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          num='(0|[1-9][0-9]*)'
          pre="(${num}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          if [[ ! "${TAG}" =~ ^v${num}\.${num}\.${num}(-${pre}(\.${pre})*)?$ ]]; then
            echo "Tag '${TAG}' is not a release tag such as v0.1.0 or v0.1.0-rc.1." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: List the plugins
        id: plugins
        run: echo "plugins=$(make -s list-plugins)" >> "${GITHUB_OUTPUT}"

  # An image with a HIGH or CRITICAL finding that has a fix stops the
  # release before it pushes anything.
  scan:
    name: Scan ${{ matrix.plugin }} (${{ matrix.platform }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
        platform: [linux/amd64, linux/arm64]
    env:
      IMG: camunda-operator-plugins-${{ matrix.plugin }}:scan
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        run: make docker-buildx "PLUGIN=${{ matrix.plugin }}" "IMG=${IMG}" "PLATFORMS=${{ matrix.platform }}" BUILDX_OUTPUT=--load

      # trivy-action is pinned to the commit of its tag, so a moved tag
      # cannot change the code that runs here.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish ${{ matrix.plugin }}
    needs: [plan, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr
      id-token: write   # keyless cosign signing via OIDC
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
      VERSION: ${{ needs.plan.outputs.version }}
      IMG: ghcr.io/konsole-is/camunda-operator-plugins/${{ matrix.plugin }}:${{ needs.plan.outputs.version }}
      CHART_REGISTRY: oci://ghcr.io/konsole-is/camunda-operator-plugins/charts
      CHART_REPO: ghcr.io/konsole-is/camunda-operator-plugins/charts/${{ matrix.plugin }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: make docker-buildx "PLUGIN=${PLUGIN}" "IMG=${IMG}" "VERSION=${VERSION}"

      - name: Resolve the image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect "${IMG}" --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Check that the image reports the version
        run: |
          got=$(docker run --rm --platform linux/amd64 "${IMG}" -version)
          if [[ "${got}" != "${VERSION}" ]]; then
            echo "The image reports '${got}', not ${VERSION}." >&2
            exit 1
          fi

      # helm push writes the digest on a line of its own. Without pipefail
      # the tee would hide a failed push.
      - name: Package and push the chart
        id: chart
        run: |
          set -o pipefail
          helm package "charts/${PLUGIN}" --version "${VERSION}" --app-version "${VERSION}" --destination dist
          helm push "dist/${PLUGIN}-${VERSION}.tgz" "${CHART_REGISTRY}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest:[[:space:]]*\(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | head -1)
          if [[ -z "${digest}" ]]; then
            echo "Could not parse the chart digest from the helm push output." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Check that the chart carries the version
        run: |
          helm show chart "${CHART_REGISTRY}/${PLUGIN}" --version "${VERSION}" > chart.yaml
          grep -Eqx "version: ${VERSION}" chart.yaml
          grep -Eqx "appVersion: \"?${VERSION}\"?" chart.yaml

      # Sign by digest, never by tag. Tags are mutable.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/konsole-is/camunda-operator-plugins/${PLUGIN}@${{ steps.image.outputs.digest }}"

      - name: Sign the chart
        run: cosign sign --yes "${CHART_REPO}@${{ steps.chart.outputs.digest }}"

  # A prerelease, such as a test tag or a release candidate, leaves the
  # catalog of the fleet manager as it is.
  catalog:
    name: Update the catalog of the fleet manager
    needs: [plan, publish]
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/catalog.yml
    with:
      tag: ${{ github.ref_name }}
      base: main
    secrets:
      OPERATOR_CATALOG_TOKEN: ${{ secrets.OPERATOR_CATALOG_TOKEN }}
