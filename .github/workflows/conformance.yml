name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run on main is not cancelled, so that it ends, cleans up the AWS
# sandbox, and can file its issue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Each plugin of kind, or each set of a plugin, gets its own job and its
  # own kind cluster. The job runs on every pull request, so that its check
  # reports and can be required. A pull request that touches only the docs
  # or other plugins ends it after the scope step, with the check green.
  conformance:
    name: Conformance of ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One line for each plugin, with test/conformance/<plugin>/ for its
        # setup, or for each set, with test/conformance/<plugin>/<set>/. The
        # check is the name that the ruleset of main requires. The set
        # ebs-only of aws runs aws-ebs, whose check keeps its name. See
        # CONTRIBUTING.md.
        include:
          - {check: aws-ebs, plugin: aws, set: ebs-only}
          - {check: gateway-access, plugin: gateway-access}
          - {check: rustfs, plugin: rustfs}
    env:
      PLUGIN: ${{ matrix.plugin }}
      CONFORMANCE_SET: ${{ matrix.set }}
      KIND_CLUSTER: conformance
      CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-report/${{ matrix.check }}.xml
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check if the change can affect the plugin
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          run=$(test/conformance/scope.sh "${PLUGIN}" "${BASE}" "${HEAD}")
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          if [ "${run}" = false ]; then
            echo "The change touches nothing that the conformance run of ${PLUGIN} uses." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install the kind tools
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/kind-tools

      - name: Run the conformance suite on kind
        if: steps.scope.outputs.run == 'true'
        run: make conformance-kind

      - name: Upload the conformance report
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ matrix.check }}
          path: conformance-report/
          if-no-files-found: warn

      - name: Read the kind cluster
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl get pluginregistrations,pluginrequests,grants -A -o yaml || true
          kubectl get gateways,httproutes,grpcroutes -A -o yaml || true
          kubectl get storageclasses -o yaml || true
          echo "=== logs of deployment/camunda-operator-controller-manager in camunda-operator-system"
          kubectl logs -n camunda-operator-system deployment/camunda-operator-controller-manager --all-containers --tail=300 || true
          # Each release of the plugin, with the name of its Pod on each line.
          echo "=== logs of the releases of ${PLUGIN} in camunda-operator-plugins"
          kubectl logs -n camunda-operator-plugins -l "app.kubernetes.io/name=${PLUGIN}" --all-containers --prefix --tail=300 || true

  # Each set of the AWS sandbox gets its own job, its own kind cluster, and
  # its own run in the AWS sandbox. These checks are never required.
  conformance-aws:
    name: Conformance of aws (${{ matrix.set }}) in the AWS sandbox
    # A pull request runs these rows only when the trusted user opened it
    # from a branch of this repository, and opened or pushed it in this event.
    # A reopen skips them. Every other pull request, Renovate included, skips
    # them, and they run on main after the merge. GitHub gives a fork no OIDC
    # token, and the CI role checks the actor ID in the token.
    if: >-
      github.repository == 'konsole-is/camunda-operator-plugins' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      format('{0}', github.event.pull_request.user.id) == vars.AWS_SANDBOX_ACTOR_ID &&
      github.actor_id == vars.AWS_SANDBOX_ACTOR_ID))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.actor_id == vars.AWS_SANDBOX_ACTOR_ID && 'aws-sandbox' || 'aws-sandbox-review' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # One line for each set of test/conformance/aws/ that runs in the AWS
        # sandbox. every-controller runs the suite of each registration
        # against one release. two-releases runs two releases in one
        # namespace, and moves the second into the first. See CONTRIBUTING.md.
        set:
          - every-controller
          - two-releases
    env:
      PLUGIN: aws
      CONFORMANCE_SET: ${{ matrix.set }}
      KIND_CLUSTER: conformance
      CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-report/aws-${{ matrix.set }}.xml
      # One run ID for each row. issuer.sh refuses an ID that does not match
      # cpo-ci-[a-z0-9-]{1,40}.
      RUN_ID: cpo-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_KMS_REPLICA_REGION: ${{ vars.AWS_KMS_REPLICA_REGION }}
      AWS_ISSUER_BUCKET: ${{ vars.AWS_ISSUER_BUCKET }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check if the change can affect the plugin
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          run=$(test/conformance/scope.sh "${PLUGIN}" "${BASE}" "${HEAD}")
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          if [ "${run}" = false ]; then
            echo "The change touches nothing that the conformance run of ${PLUGIN} uses." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install the kind tools
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/kind-tools

      - name: Get the credentials of the CI role
        id: aws
        if: steps.scope.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR Public limits an anonymous pull, and test/kind/pod-identity-webhook.sh
      # pulls its image on the runner. Its login token comes only from us-east-1.
      - name: Log in to ECR Public
        if: steps.scope.outputs.run == 'true'
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Publish the issuer of the run
        id: issuer
        if: steps.scope.outputs.run == 'true'
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}" >> "${GITHUB_ENV}"
          out=$(hack/aws-sandbox/issuer.sh up "${RUN_ID}" "${RUNNER_TEMP}/issuer")
          echo "${out}"
          echo "KIND_CONFIG=${RUNNER_TEMP}/issuer/kind.yaml" >> "${GITHUB_ENV}"
          echo "AWS_OIDC_PROVIDER_ARN=$(sed -n 's/^provider=//p' <<< "${out}")" >> "${GITHUB_ENV}"

      - name: Run the conformance suite on kind
        if: steps.scope.outputs.run == 'true'
        run: make conformance-kind

      - name: Upload the conformance report
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-aws-${{ matrix.set }}
          path: conformance-report/
          if-no-files-found: warn

      - name: Read the kind cluster
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl get pluginregistrations,pluginrequests,grants -A -o yaml || true
          kubectl get leases -n camunda-operator-plugins -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true
          for target in \
            "camunda-operator-system deployment/camunda-operator-controller-manager" \
            "default deployment/pod-identity-webhook"; do
            read -r namespace workload <<< "${target}"
            echo "=== logs of ${workload} in ${namespace}"
            kubectl logs -n "${namespace}" "${workload}" --all-containers --tail=300 || true
          done
          # Each release of the plugin, with the name of its Pod on each line.
          echo "=== logs of the releases of ${PLUGIN} in camunda-operator-plugins"
          kubectl logs -n camunda-operator-plugins -l "app.kubernetes.io/name=${PLUGIN}" --all-containers --prefix --tail=300 || true

      # The first session of the CI role can be over: it lasts one hour.
      - name: Get the credentials of the CI role for the cleanup
        if: ${{ always() && steps.issuer.outcome != 'skipped' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The kind cluster goes first, so that no controller creates an object
      # again. The step fails when the run left a role, a policy, an OIDC
      # provider, or a bucket.
      - name: Remove what the run created
        if: ${{ always() && steps.issuer.outcome != 'skipped' }}
        run: |
          kind delete cluster --name "${KIND_CLUSTER}" || true
          hack/aws-sandbox/teardown.sh "${RUN_ID}"

  # The shared cases of pkg/awskit against the AWS sandbox, so that a fake
  # that answers otherwise than AWS fails. The check is never required.
  awskit-sandbox:
    name: Fakes against the AWS sandbox
    # The same condition as the job conformance-aws.
    if: >-
      github.repository == 'konsole-is/camunda-operator-plugins' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      format('{0}', github.event.pull_request.user.id) == vars.AWS_SANDBOX_ACTOR_ID &&
      github.actor_id == vars.AWS_SANDBOX_ACTOR_ID))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.actor_id == vars.AWS_SANDBOX_ACTOR_ID && 'aws-sandbox' || 'aws-sandbox-review' }}
    permissions:
      contents: read
      id-token: write
    env:
      # leftovers.sh refuses an ID that does not match cpo-ci-[a-z0-9-]{1,40}.
      RUN_ID: cpo-ci-${{ github.run_id }}-${{ github.run_attempt }}-awskit
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_KMS_REPLICA_REGION: ${{ vars.AWS_KMS_REPLICA_REGION }}
      AWS_ISSUER_BUCKET: ${{ vars.AWS_ISSUER_BUCKET }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check if the change can affect the fakes
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # No pipe into grep -q: with pipefail, its early exit can fail git diff.
          files=$(git diff --no-renames --name-only "${BASE}...${HEAD}")
          run=false
          if grep -qE '^(pkg/awskit/|go\.(mod|sum)$|hack/aws-sandbox/|\.github/workflows/conformance\.yml$)' <<< "${files}"; then
            run=true
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"
          if [ "${run}" = false ]; then
            echo "The change touches nothing that the shared cases of pkg/awskit use." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Get the credentials of the CI role
        id: aws
        if: steps.scope.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The cases wait for AWS to show each write, and a versioning case
      # waits 15 minutes, so they run in parallel.
      - name: Run the shared cases against the AWS sandbox
        if: steps.scope.outputs.run == 'true'
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: go test -tags sandbox -count=1 -v -parallel 32 -timeout 40m -run 'CasesInTheSandbox$' ./pkg/awskit/

      # The first session of the CI role can be over: it lasts one hour.
      - name: Get the credentials of the CI role for the cleanup
        if: ${{ always() && steps.aws.outcome != 'skipped' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The step fails when the run left a role, a policy, or a bucket.
      - name: Remove what the run created
        if: ${{ always() && steps.aws.outcome != 'skipped' }}
        run: hack/aws-sandbox/teardown.sh "${RUN_ID}"

  report:
    name: File an issue for a red run on main
    needs: [conformance, conformance-aws, awskit-sandbox]
    if: ${{ failure() && github.event_name == 'push' && github.repository == 'konsole-is/camunda-operator-plugins' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: File or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: hack/failure-issue.sh "Conformance failed on main" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
